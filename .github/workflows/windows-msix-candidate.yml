name: Windows - paquete para Microsoft Store (MSIX)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-msix-candidate.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'forge.config.cjs'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'assets/**'
      - 'src/**'
      - 'services/**'
      - 'ui/**'
      - 'bootstrap.js'
      - 'main.js'
      - 'preload.js'
      - 'renderer.js'
      - 'index.html'

permissions:
  contents: write

concurrency:
  group: windows-msix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas y candidatos MSIX x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Obtener codigo del commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Generar MSIX de prueba sin firma
        run: npm run make:msix:test

      - name: Generar candidato MSIX con identidad oficial (sin firma)
        run: npm run make:msix

      - name: Publicar candidatos de evaluacion, NO version final
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patagonia-msix-candidates-unsigned-${{ github.sha }}
          path: |
            dist/msix/*-TEST-UNSIGNED.msix
            dist/msix/*-TEST-UNSIGNED.msix.sha256
            dist/msix/*-STORE-UNSIGNED.msix
            dist/msix/*-STORE-UNSIGNED.msix.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Dejar el MSIX para Partner Center en un release borrador (no se publica)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="store-v$VERSION"
          ARCHIVOS=$(ls dist/msix/*-STORE-UNSIGNED.msix dist/msix/*-STORE-UNSIGNED.msix.sha256)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" $ARCHIVOS --clobber --repo "$GITHUB_REPOSITORY"
          else
            printf 'Paquete MSIX **sin firma** para subir a Microsoft Store (Partner Center).\n\nNo es para instalar: Microsoft lo firma al aprobarlo. **No publicar este borrador.**\n' > notas-store.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Microsoft Store $VERSION (MSIX para Partner Center)" --notes-file notas-store.md $ARCHIVOS
          fi
